# Haystack configuration
# Copy to ~/.config/haystack/config.toml (or set NR_CONFIG). Legacy installs using ~/.config/notes-router still work.

[vault]
path = "~/notes"                      # your markdown vault root
index_convention = "list"             # "list" = maintain INDEX.md links, "none" = don't
exclude_dirs = ["archive/", "runs/", "media/", "anexos/", "evidencias/", "devlog/", "tabs/"]
exclude_files = ["LOG.md", "INDEX.md"]

# Extra files outside the vault to index (TOML: still inside [vault] table)
external = []
# external = ["~/.local/share/notes/open-loops.md"]

[index]
db = "~/.cache/haystack/index.sqlite"

[embeddings]
# Any OpenAI-compatible /v1/embeddings endpoint works:
# llama.cpp server, Ollama (/v1), LM Studio, a remote API.
# Multilingual vault? Serve granite-embedding-97m-multilingual-r2 via
# scripts/onnx-embed-server.py (PT/52 languages; English quality is -4pp
# vs bge-small — see docs/RESEARCH.md P3 before switching).
url = "http://127.0.0.1:8082/v1/embeddings"
model = ""                            # some endpoints require a model name (e.g. "bge-small-en-v1.5")

[audit]
# Ground-truth QA pairs for `notes-router audit`. Start empty;
# seed it with real queries via `learn` / `review`.
qa_file = "~/.config/haystack/qa.json"

[rerank]
# optional cross-encoder rerank (llama-server --reranking on a reranker GGUF)
# url = "http://127.0.0.1:8084"
# top = 20          # 10 -> ~450ms/call (interactive), 20 -> ~1s (max quality)
# max_chars = 600    # reranker input cap (latency lever)

[temporal]
# relative-time queries ("what did I ask yesterday"): recency + asked-before
# boosts (inert on queries without a time expression). Weights are additive
# on the fused score (~0.006-0.012 range).
# weight = 0.008      # file mtime inside the window
# asked_weight = 0.004 # file answered a logged query inside the window

[clusters]
# semantic cluster layer (k-means over title chunks; `clusters` lists them).
# Measured NEUTRAL-NEGATIVE on content alone (-1pp MRR at every weight);
# off until clusters come from usage/query patterns, not text.
enable = false
# weight = 0.001
# k = 0               # 0 = auto (sqrt of file count)
