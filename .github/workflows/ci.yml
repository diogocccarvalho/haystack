name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install llama-server (prebuilt release)
        run: |
          TAG=$(curl -s https://api.github.com/repos/ggml-org/llama.cpp/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "llama.cpp $TAG"
          curl -fL -o ll.zip "https://github.com/ggml-org/llama.cpp/releases/download/${TAG}/llama-${TAG}-bin-ubuntu-x64.zip"
          unzip -q ll.zip
          sudo mv build/bin/llama-server /usr/local/bin/
          llama-server --version
      - name: download bge-small model
        run: |
          mkdir -p ~/.local/share/haystack/models
          curl -fL --retry 3 -o ~/.local/share/haystack/models/bge-small-en-v1.5-q8_0.gguf \
            "https://huggingface.co/ggml-org/bge-small-en-v1.5-Q8_0-GGUF/resolve/main/bge-small-en-v1.5-q8_0.gguf"
      - name: start embeddings server
        run: |
          nohup llama-server -m ~/.local/share/haystack/models/bge-small-en-v1.5-q8_0.gguf \
            --embeddings --pooling cls -c 512 -ub 512 -t 2 --port 8082 --host 127.0.0.1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8082/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8082/health
      - name: run sim suite
        run: python3 tests/sim.py
